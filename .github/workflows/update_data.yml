name: Update Election Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # to dispatch the Pages deploy after a data push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Snapshot candidate data before scrape
        run: cp data/candidates.json /tmp/candidates_before.json

      - name: Run scraper
        run: python scraper/main.py

      # Roster changes: new filings, withdrawals, and silently-broken scrapers.
      - name: Detect roster changes
        id: detect
        run: |
          SUMMARY=$(python scraper/detect_new_registrations.py \
            /tmp/candidates_before.json data/candidates.json /tmp/issue_body.md \
            data/metadata.json)
          if [ -n "$SUMMARY" ]; then
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          fi

      # The commit subject carries the delta, so `git log --oneline` is a
      # readable change feed and a quiet run is visibly quiet — no session
      # needed to find out what happened.
      - name: Commit and push updated data
        id: push
        env:
          SUMMARY: ${{ steps.detect.outputs.summary }}
        run: |
          git config user.name "election-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            if [ -n "$SUMMARY" ]; then
              git commit -m "Auto-update: $SUMMARY ($STAMP)"
            else
              git commit -m "Auto-update: no roster changes ($STAMP)"
            fi
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do NOT trigger other workflows
      # (GitHub's anti-recursion rule), so the on-push trigger in
      # pages.yml never fires for the bot's commits — the site would
      # serve stale data forever. workflow_dispatch is exempt from that
      # rule, so dispatch the deploy explicitly.
      - name: Deploy the site with the fresh data
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: Open issue for roster change(s)
        if: steps.detect.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.detect.outputs.summary }}
        run: |
          gh label create new-registration --color 1f883d \
            --description "Auto: candidate roster changed" 2>/dev/null || true
          gh issue create --title "🗳️ $TITLE" \
            --body-file /tmp/issue_body.md --label new-registration
